name: Validate Gateway
on:
  pull_request:
    branches: [staging, main]
    paths: ['src/**', 'test/**', 'config/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', '.github/workflows/**']
  push:
    branches: [staging]
    paths: ['src/**', 'test/**', 'config/**', 'package.json', 'pnpm-lock.yaml', 'tsconfig.json', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
