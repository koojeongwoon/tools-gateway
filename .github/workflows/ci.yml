name: CI - Build and Push Tools Gateway Image

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-gateway:
    if: (vars.BUILD_BACKEND == '' || vars.BUILD_BACKEND == 'github')
    name: Build Tools Gateway (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared hosted and PC test suite
        run: bash scripts/test-build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tools-gateway:v1.0.${{ github.run_number }}
            ghcr.io/${{ github.repository_owner }}/tools-gateway:latest
            ghcr.io/${{ github.repository_owner }}/tools-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Retain OCI child manifests; package-version pruning can break tagged images.
